<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>កិច្ចសន្យាជួលទូរស័ព្ទ</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Noto+Sans+Khmer:wght@400;700&family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f0;--card:#fff;--ink:#17211d;--mut:#5d6b65;--line:#cfd8d4;--acc:#0f6b4f;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2420;--ink:#e8efec;--mut:#9fb0a8;--line:#31403a;--acc:#4cc59b;--accink:#06251a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Kantumruy Pro","Noto Sans Khmer",sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:12px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
@media(max-width:900px){.panel{position:static;max-height:none}}
h1{font-size:17px;margin:0 0 6px}label{display:block;font-size:13px;color:var(--mut);margin:9px 0 2px}
input,select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:8px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.pb{margin-top:10px;width:100%;padding:11px;background:var(--acc);color:var(--accink);border:0;border-radius:6px;font:600 15px "Kantumruy Pro",sans-serif;cursor:pointer}
.pb.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.sum{margin-top:10px;padding:9px;border:1px dashed var(--line);border-radius:6px;font-size:13px}
.pages{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:0}
.page{background:#fff;color:#000;width:210mm;height:297mm;padding:9mm 13mm 10mm;font:12pt/1.6 "Battambang","Noto Serif Khmer",serif;word-break:normal;line-break:auto;box-shadow:0 1px 6px rgba(0,0,0,.25);overflow:hidden;position:relative;flex:none}
.page p{margin:0;text-align:justify;text-justify:inter-character}.art .sub{margin-left:-16mm}.art .sub>i{width:16mm}#p2>.sub{padding-left:8mm!important}#p2>.sub>i{width:16mm}.art.par>.h{width:30mm}.lg{position:absolute;left:18mm;top:10mm;height:15mm}.m{font-family:"Moul","Battambang",serif;font-weight:400}
.c{text-align:center}.page p.c,.page .c{text-align:center}.b{font-weight:700}
.h{font-family:"Moul","Battambang",serif;display:inline-block;line-height:1.9}.art b.m{display:block;line-height:1.9}
.art{display:flex}.art>.h{flex:none;width:24mm}.art>div{flex:1}
.sub{display:flex;padding-left:27mm}.sub>i{font-style:normal;flex:none;width:11mm}.sub>div{flex:1}
.v{border-bottom:1px dotted #000;font-weight:700;padding:0 2px;white-space:pre-wrap}
.sig{display:flex;justify-content:space-between;margin-top:6mm;padding:0 8mm}
.bank{font-family:"Noto Sans Khmer","Khmer UI",sans-serif;font-size:11.5pt;line-height:2}
.bank p{text-align:left}
.qr{position:absolute;right:20mm;top:178mm;width:62mm}.brand{display:block;max-width:210px;margin:0 auto 8px}.tg{background:#229ed9!important;color:#fff!important}details{margin-top:8px;font-size:13px}
@media print{
 @page{size:A4;margin:0}body{background:#fff}.app{display:block;padding:0}.panel{display:none}
 .pages{display:block;zoom:1!important}.page{box-shadow:none;page-break-after:always;break-after:page}
 body.pc .bank,body.pb2 .ct{display:none}
}
</style></head><body>

function fit(){const p=$("pages"),w=p.parentElement.clientWidth-8;p.style.zoom=1;
 const cts=[$("p1"),$("p2")];let fs=12;cts.forEach(e=>e.style.fontSize=fs+"pt");
 while(fs>8&&cts.some(e=>e.scrollHeight>e.clientHeight+1)){fs-=.1;cts.forEach(e=>e.style.fontSize=fs.toFixed(1)+"pt")}
 p.style.zoom=Math.min(1,w/794)}
function pr(c){save();document.body.className=c;$("pages").style.zoom=1;window.print();setTimeout(()=>{document.body.className="";fit()},500)}
const K="sky_customers",FL=["name","sex","phone","dob","idn","idd","addr","model","qty","price","day","fine","icl"];
const ld=()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return{}}};
function save(){const n=$("name").value.trim();if(!n)return;const o=ld(),r={};FL.forEach(i=>r[i]=$(i).value);o[n]=r;try{localStorage.setItem(K,JSON.stringify(o))}catch(e){};dl()}
function dl(){$("cl").innerHTML=Object.keys(ld()).map(n=>`<option value="${esc(n)}">`).join("")}
function pick(){const r=ld()[$("name").value.trim()];if(r){FL.forEach(i=>{if(i!=="day")$(i).value=r[i]});render()}}
try{$("tok").value=localStorage.getItem("sky_tok")||"";$("cid").value=localStorage.getItem("sky_cid")||""}catch(e){}
async function tg(){save();const g=i=>$(i).value.trim(),end=addM(now,months);
 const txt=`📄 កិច្ចសន្យាជួលទូរស័ព្ទ - SKY PHONE SHOP\n👤 ឈ្មោះ: ${g("name")} (${g("sex")})\n📞 ទូរស័ព្ទ: ${g("phone")}\n🪪 អត្តសញ្ញាណប័ណ្ណ: ${g("idn")}\n🏠 អាសយដ្ឋាន: ${g("addr")}\n📱 ម៉ូដែល: ${g("model")} x${g("qty")}\n⏳ រយៈពេល: ${months} ខែ (${dmy(now)} → ${dmy(end)})\n💵 តម្លៃ/ខែ: ${g("price")} USD, បង់ថ្ងៃទី ${$("day").value}\n⚠️ ពិន័យ/ថ្ងៃ: ${g("fine")} USD, iCloud: ${g("icl")} USD`;
 const t=$("tok").value.trim(),c=$("cid").value.trim(),s=$("tgs");s.hidden=false;
 try{localStorage.setItem("sky_tok",t);localStorage.setItem("sky_cid",c)}catch(e){}
 if(t&&c){try{const r=await fetch(`https://api.telegram.org/bot${t}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:c,text:txt})});const j=await r.json();if(j.ok){s.textContent="✔ បានផ្ញើទៅ Telegram ហើយ";return}s.textContent="Telegram បដិសេធ៖ "+(j.description||"")}catch(e){s.textContent="ផ្ញើដោយផ្ទាល់មិនបាន ប្រើ Telegram ធម្មតាជំនួស"}}
 window.open("https://t.me/share/url?url="+encodeURIComponent("SKY PHONE SHOP")+"&text="+encodeURIComponent(txt),"_blank")}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{months=+b.dataset.m;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));render()});
document.querySelectorAll("input,select").forEach(el=>el.oninput=render);$("name").addEventListener("change",pick);dl();document.fonts&&document.fonts.ready.then(fit);
addEventListener("resize",fit);render();
</script></body></html>
